name: Export question bank

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'bank.json'
      - '.github/workflows/export-bank.yml'

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Split bank by year and subject
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, re
          from collections import defaultdict

          with open('bank.json', encoding='utf-8') as f:
              bank = json.load(f)
          if not isinstance(bank, dict) or not isinstance(bank.get('questions'), list):
              raise SystemExit('Invalid bank.json: expected an object with a questions array')
          questions = bank['questions']
          if not questions:
              raise SystemExit('Invalid bank.json: questions array is empty')

          out = 'export'
          os.makedirs(out, exist_ok=True)
          with open(f'{out}/bank-full.json', 'w', encoding='utf-8') as f:
              json.dump(bank, f, ensure_ascii=False, separators=(',', ':'))

          def safe(value):
              return re.sub(r'[^0-9A-Za-z_-]+', '_', str(value)).strip('_') or 'unknown'

          groups = defaultdict(list)
          missing = 0
          for q in questions:
              if not isinstance(q, dict):
                  missing += 1
                  continue
              year, subject = q.get('year'), q.get('subject')
              if year in (None, '') or subject in (None, ''):
                  missing += 1
                  continue
              session = q.get('session', '未標示')
              groups[(safe(year), safe(session), safe(subject))].append(q)

          if not groups:
              raise SystemExit('No year/subject groups found; refusing to publish empty split output')

          for (year, session, subject), rows in sorted(groups.items()):
              directory = f'{out}/{year}/{session}'
              os.makedirs(directory, exist_ok=True)
              with open(f'{directory}/{subject}.json', 'w', encoding='utf-8') as f:
                  json.dump({'year': year, 'session': session, 'subject': subject,
                             'questions': rows}, f, ensure_ascii=False, separators=(',', ':'))

          with open(f'{out}/README.txt', 'w', encoding='utf-8') as f:
              f.write(f'Total questions: {len(questions)}\n')
              f.write(f'Questions included in year/session/subject files: {sum(map(len, groups.values()))}\n')
              f.write(f'Groups created: {len(groups)}\n')
              f.write(f'Rows without usable year/subject metadata: {missing}\n')
              f.write('bank-full.json contains the complete original bank object.\n')
          print(f'Exported {len(questions)} total questions; {sum(map(len, groups.values()))} grouped; {len(groups)} files.')
          if missing:
              print(f'WARNING: {missing} rows were not included in grouped files; they remain in bank-full.json.')
          PY

      - name: Upload question bank artifact
        uses: actions/upload-artifact@v4
        with:
          name: question-bank-export
          path: export/
          if-no-files-found: error
          retention-days: 30
