name: Verify official answer key

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'bank.json'
      - 'scripts/verify_official_answers.py'
      - '.github/workflows/verify-official-answers.yml'

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install verifier dependencies
        run: python3 -m pip install --disable-pip-version-check requests pymupdf

      - name: Apply official answer corrections
        run: python3 scripts/verify_official_answers.py --fix

      - name: Re-verify all 2,400 questions
        run: python3 scripts/verify_official_answers.py

      - name: Commit corrected bank and verification record
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bank.json official_answer_verification.json
          if git diff --cached --quiet; then
            echo "No corrections to commit."
          else
            git commit -m "Verify and correct official answer key"
            git push
          fi

      - name: Upload verification report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: official-answer-verification
          path: official_answer_verification.json
          if-no-files-found: error
          retention-days: 30
