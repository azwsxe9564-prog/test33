name: Deploy test33 study site
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Prepare site
        run: |
          set -euo pipefail
          mkdir -p site/data
          cp index.html site/index.html
          cp study_engine.js site/study_engine.js
          cp bank.json site/data/bank.json
          touch site/.nojekyll
      - name: Publish to gh-pages branch
        run: |
          set -euo pipefail
          cd site
          git init
          git checkout -b gh-pages
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .
          git commit -m 'Deploy test33 study site'
          git push --force https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }} gh-pages
