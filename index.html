<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>社工師國考｜交錯學習</title>
<style>
:root{font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif;color:#20242b;background:#f5f7fb}*{box-sizing:border-box}body{margin:0;padding:20px}.wrap{max-width:850px;margin:auto}.panel{background:white;border:1px solid #dfe4ec;border-radius:16px;padding:20px;margin:14px 0;box-shadow:0 2px 8px #17203308}h1{font-size:clamp(1.4rem,4vw,2rem);margin:0 0 8px}.muted{color:#667085}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}select,button,input{font:inherit;border:1px solid #cbd3df;border-radius:9px;padding:10px;background:white}button{cursor:pointer;font-weight:650}button.primary{background:#245fc7;color:white;border-color:#245fc7}button:disabled{opacity:.45;cursor:not-allowed}.question{font-size:1.12rem;line-height:1.8;white-space:pre-wrap}.choices{display:grid;gap:9px;margin:16px 0}.choice{text-align:left;line-height:1.5}.choice.selected{outline:2px solid #245fc7;background:#edf4ff}.choice.correct{border-color:#198754;background:#eaf7ef}.choice.wrong{border-color:#c0392b;background:#fff0ee}.status{padding:10px 12px;border-radius:9px;background:#f0f3f8;margin:12px 0}.status.ok{background:#eaf7ef;color:#146c43}.status.bad{background:#fff0ee;color:#a52822}.progress{height:8px;background:#e8edf4;border-radius:99px;overflow:hidden}.progress>div{height:100%;background:#245fc7;width:0}a{color:#245fc7}
</style></head>
<body><main class="wrap">
<header class="panel"><h1>社工師國考｜交錯學習</h1><p class="muted">獨立測試站｜依科目交錯、每輪完整出題，並保留本機進度。</p><div class="row"><label>年度 <select id="year"><option value="all">全部年度</option></select></label><label>科目 <select id="subject"><option value="all">全部五科</option></select></label><button id="start" class="primary">開始／繼續</button><button id="reset">重設本組進度</button></div><div class="status" id="loadStatus" role="status">正在載入題庫…</div></header>
<section class="panel" id="quiz" hidden><div class="row muted"><span id="subjectTag"></span><span id="count"></span><span id="cycle"></span></div><div class="progress"><div id="bar"></div></div><p class="question" id="question"></p><div class="choices" id="choices"></div><div id="feedback" class="status" hidden aria-live="polite"></div><div class="row"><button id="check" class="primary" disabled>確認答案</button><button id="next" disabled>下一題</button></div></section>
<section class="panel"><h2>進度</h2><p id="stats" class="muted">尚無作答紀錄。</p><p id="syncStatus" class="status">跨裝置同步尚未設定；目前進度保存在此瀏覽器。</p><p class="muted">跨裝置同步需要設定雲端資料庫與登入方式，設定完成前請勿清除瀏覽器資料。</p></section>
</main>
<script src="study_engine.js"></script><script>
(()=>{'use strict';
const $=id=>document.getElementById(id), subjects=window.SWStudyEngine?.subjectOrder||[];
let bank=[],current=null,selected=null,answered=false,state=null,stats={attempts:0,correct:0};
const STATS_KEY='sw_quiz_stats_v1';
function safeParse(s,fallback){try{return JSON.parse(s)||fallback}catch(_){return fallback}}
function filters(){return {year:$('year').value,subject:$('subject').value}}
function eligible(){const f=filters();return bank.filter(q=>(f.year==='all'||String(q.year)===f.year)&&(f.subject==='all'||q.subject===f.subject))}
function save(){if(window.SWStudyEngine)SWStudyEngine.writeState(state);localStorage.setItem(STATS_KEY,JSON.stringify(stats));renderStats()}
function renderStats(){const pool=state?.pools?.[SWStudyEngine.poolKey(filters())];$('stats').textContent=`累計作答 ${stats.attempts} 題｜答對 ${stats.correct} 題｜目前篩選已完成 ${pool?.seenIds?.length||0}／${pool?.eligibleCount||eligible().length} 題`}
function loadQuestion(q){current=q;selected=null;answered=false;$('quiz').hidden=false;$('subjectTag').textContent=q.subject;$('count').textContent=`本輪第 ${state.pools[SWStudyEngine.poolKey(filters())].position} 題`;$('cycle').textContent=`第 ${state.pools[SWStudyEngine.poolKey(filters())].cycle} 輪`;$('question').textContent=q.question;$('choices').replaceChildren();(q.choices||[]).forEach((text,i)=>{const b=document.createElement('button');b.className='choice';b.textContent=`${String.fromCharCode(65+i)}. ${text}`;b.addEventListener('click',()=>{if(answered)return;selected=i+1;[...$('choices').children].forEach(x=>x.classList.remove('selected'));b.classList.add('selected');$('check').disabled=false});$('choices').append(b)});$('feedback').hidden=true;$('check').disabled=true;$('next').disabled=true;const pool=state.pools[SWStudyEngine.poolKey(filters())];$('bar').style.width=`${Math.min(100,(pool.seenIds.length/Math.max(1,pool.eligibleCount))*100)}%`}
function start(){const list=eligible();if(!list.length){$('loadStatus').textContent='目前篩選沒有題目。請確認題庫已放入 data/bank.json，且欄位包含 questions。';return}const f=filters();let q=SWStudyEngine.resume(list,f,state);if(!q){const result=SWStudyEngine.nextQuestion(list,f,state);q=result.question;save()}if(q)loadQuestion(q);else $('loadStatus').textContent='找不到可載入的題目。'}
$('check').addEventListener('click',()=>{if(!current||selected==null||answered)return;answered=true;const accepted=Array.isArray(current.accepted_answers)&&current.accepted_answers.length?current.accepted_answers:[current.answer];const ok=accepted.map(Number).includes(Number(selected));stats.attempts++;if(ok)stats.correct++;const feedback=$('feedback');feedback.hidden=false;feedback.className='status '+(ok?'ok':'bad');feedback.textContent=(ok?'答對！':'答錯。')+` 正確答案：${(accepted||[]).map(n=>String.fromCharCode(64+Number(n))).join('、')}`+(current.explanation?`\n解析：${current.explanation}`:'');[...$('choices').children].forEach((b,i)=>{if(accepted.map(Number).includes(i+1))b.classList.add('correct');else if(i+1===selected)b.classList.add('wrong')});$('check').disabled=true;$('next').disabled=false;save()});
$('next').addEventListener('click',()=>{const list=eligible(),f=filters();const result=SWStudyEngine.nextQuestion(list,f,state);save();if(result.question)loadQuestion(result.question);else{$('question').textContent='本輪已完成！';$('choices').replaceChildren();$('feedback').hidden=false;$('feedback').className='status ok';$('feedback').textContent='所選題庫本輪已全部完成。按「下一題」開始新一輪。';$('next').disabled=false}});
$('start').addEventListener('click',start);$('reset').addEventListener('click',()=>{if(!confirm('確定重設目前年度與科目的出題進度？作答統計不會清除。'))return;delete state.pools[SWStudyEngine.poolKey(filters())];save();$('quiz').hidden=true;$('loadStatus').textContent='此組進度已重設。按「開始／繼續」重新出題。'});
['year','subject'].forEach(id=>$(id).addEventListener('change',()=>{current=null;$('quiz').hidden=true;renderStats()}));
fetch('data/bank.json').then(r=>{if(!r.ok)throw Error(`HTTP ${r.status}`);return r.json()}).then(data=>{bank=Array.isArray(data)?data:(data.questions||[]);const years=[...new Set(bank.map(q=>String(q.year)).filter(Boolean))].sort();years.forEach(y=>{const o=document.createElement('option');o.value=y;o.textContent=`${y} 年`; $('year').append(o)});subjects.forEach(s=>{const o=document.createElement('option');o.value=s;o.textContent=s;$('subject').append(o)});state=SWStudyEngine.readState();stats=safeParse(localStorage.getItem(STATS_KEY),stats);$('loadStatus').textContent=`題庫載入 ${bank.length.toLocaleString()} 題。選年度／科目後開始。`;renderStats()}).catch(e=>{$('loadStatus').textContent=`題庫載入失敗：${e.message}。請確認 data/bank.json 已提交且格式正確。`});
})();
</script></body></html>
