<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>社工師國考｜交錯學習</title>
<style>
:root{font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif;color:#20242b;background:#f5f7fb}*{box-sizing:border-box}body{margin:0;padding:20px}.wrap{max-width:850px;margin:auto}.panel{background:white;border:1px solid #dfe4ec;border-radius:16px;padding:20px;margin:14px 0;box-shadow:0 2px 8px #17203308}h1{font-size:clamp(1.4rem,4vw,2rem);margin:0 0 8px}.muted{color:#667085}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}select,button,input{font:inherit;border:1px solid #cbd3df;border-radius:9px;padding:10px;background:white}input[type=email]{min-width:220px;max-width:100%}button{cursor:pointer;font-weight:650}button.primary{background:#245fc7;color:white;border-color:#245fc7}button:disabled{opacity:.45;cursor:not-allowed}.question{font-size:1.12rem;line-height:1.8;white-space:pre-wrap}.choices{display:grid;gap:9px;margin:16px 0}.choice{text-align:left;line-height:1.5}.choice.selected{outline:2px solid #245fc7;background:#edf4ff}.choice.correct{border-color:#198754;background:#eaf7ef}.choice.wrong{border-color:#c0392b;background:#fff0ee}.status{padding:10px 12px;border-radius:9px;background:#f0f3f8;margin:12px 0;white-space:pre-wrap}.status.ok{background:#eaf7ef;color:#146c43}.status.bad{background:#fff0ee;color:#a52822}.progress{height:8px;background:#e8edf4;border-radius:99px;overflow:hidden}.progress>div{height:100%;background:#245fc7;width:0}a{color:#245fc7}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body><main class="wrap">
<header class="panel"><h1>社工師國考｜交錯學習</h1><p class="muted">依科目交錯、每輪完整出題；登入後可在不同裝置同步進度。</p>
<section aria-label="電子郵件登入"><h2>雲端同步登入</h2><div class="row"><label for="email">電子郵件</label><input id="email" type="email" autocomplete="email" placeholder="輸入你的電子郵件"><button id="login" class="primary">寄送登入連結</button><button id="logout" hidden>登出</button></div><p id="authStatus" class="status" role="status">尚未登入；目前進度保存在此瀏覽器。</p></section>
<div class="row"><label>年度 <select id="year"><option value="all">全部年度</option></select></label><label>科目 <select id="subject"><option value="all">全部五科</option></select></label><label>每組題數 <select id="questionLimit"><option value="10">10 題</option><option value="20">20 題</option><option value="30">30 題</option><option value="40">40 題</option></select></label><button id="start" class="primary">開始／繼續</button><button id="reset">重設本組進度</button></div><div class="status" id="loadStatus" role="status">正在載入題庫…</div></header>
<section class="panel" id="quiz" hidden><div class="row muted"><span id="subjectTag"></span><span id="count"></span><span id="cycle"></span></div><div class="progress"><div id="bar"></div></div><p class="question" id="question"></p><div class="choices" id="choices"></div><div id="feedback" class="status" hidden aria-live="polite"></div><div class="row"><button id="next" disabled>下一題</button></div></section>
<section class="panel"><h2>進度</h2><p id="stats" class="muted">尚無作答紀錄。</p><p id="syncStatus" class="status">登入後會同步出題進度與作答統計。</p><p class="muted">同一個電子郵件登入後，可在不同裝置接續。尚未登入時仍會保存在目前瀏覽器。</p></section>
</main>
<script src="study_engine.js"></script><script>
(()=>{'use strict';
const $=id=>document.getElementById(id), subjects=window.SWStudyEngine?.subjectOrder||[];
const SUPABASE_URL='https://cnlaurnbzlwcrcqsomfu.supabase.co';
const SUPABASE_KEY='sb_publishable_uffszUPEIM658pLMPnklpg_byZX0J8n';
const STATS_KEY='sw_quiz_stats_v1';
let bank=[],current=null,selected=null,answered=false,state=null,stats={attempts:0,correct:0},client=null,user=null,bankReady=false,cloudBusy=false,saveTimer=null,sessionAnswered=0,sessionComplete=false;
function safeParse(s,fallback){try{return JSON.parse(s)||fallback}catch(_){return fallback}}
function filters(){return {year:$('year').value,subject:$('subject').value}}
function eligible(){const f=filters();return bank.filter(q=>(f.year==='all'||String(q.year)===f.year)&&(f.subject==='all'||q.subject===f.subject))}
function renderStats(){const pool=state?.pools?.[SWStudyEngine.poolKey(filters())];$('stats').textContent=`累計作答 ${stats.attempts} 題｜答對 ${stats.correct} 題｜目前篩選已完成 ${pool?.seenIds?.length||0}／${pool?.eligibleCount||eligible().length} 題`}
function setSyncStatus(text,kind=''){const el=$('syncStatus');el.textContent=text;el.className='status'+(kind?' '+kind:'')}
function setAuthStatus(text,kind=''){const el=$('authStatus');el.textContent=text;el.className='status'+(kind?' '+kind:'')}
async function syncCloud(){if(!client||!user||!bankReady||cloudBusy)return;cloudBusy=true;setSyncStatus('正在讀取雲端進度…');try{const {data,error}=await client.from('study_progress').select('state,stats').eq('user_id',user.id).maybeSingle();if(error)throw error;if(data){state=data.state||SWStudyEngine.createState();stats=data.stats||{attempts:0,correct:0};SWStudyEngine.writeState(state);localStorage.setItem(STATS_KEY,JSON.stringify(stats));setSyncStatus('已載入雲端進度。作答後會自動同步。','ok')}else{await writeCloud();setSyncStatus('已將此瀏覽器的既有進度上傳至雲端。','ok')}renderStats();if(current)loadQuestion(current)}catch(e){setSyncStatus('雲端同步失敗：'+(e.message||'請稍後再試')+'。本機進度仍保留。','bad')}finally{cloudBusy=false}}
async function writeCloud(){if(!client||!user)return;const {error}=await client.from('study_progress').upsert({user_id:user.id,state,stats,updated_at:new Date().toISOString()},{onConflict:'user_id'});if(error)throw error}
function save(){if(state&&window.SWStudyEngine)SWStudyEngine.writeState(state);localStorage.setItem(STATS_KEY,JSON.stringify(stats));renderStats();if(client&&user){setSyncStatus('有進度待同步…');clearTimeout(saveTimer);saveTimer=setTimeout(async()=>{try{await writeCloud();setSyncStatus('雲端同步完成。','ok')}catch(e){setSyncStatus('雲端同步失敗：'+(e.message||'請稍後再試')+'。本機進度仍保留。','bad')}},500)}}
function loadQuestion(q){current=q;selected=null;answered=false;$('quiz').hidden=false;$('subjectTag').textContent=q.subject;$('count').textContent=`本組第 ${sessionAnswered+1}／${$('questionLimit').value} 題`;$('cycle').textContent=`第 ${state.pools[SWStudyEngine.poolKey(filters())].cycle} 輪`;$('question').textContent=q.question;$('choices').replaceChildren();(q.choices||[]).forEach((text,i)=>{const b=document.createElement('button');b.className='choice';b.textContent=`${String.fromCharCode(65+i)}. ${text}`;b.addEventListener('click',()=>{if(answered)return;selected=i+1;answered=true;[...$('choices').children].forEach(x=>x.classList.remove('selected'));b.classList.add('selected');gradeAnswer()});$('choices').append(b)});$('feedback').hidden=true;$('next').disabled=true;$('next').textContent='下一題';const pool=state.pools[SWStudyEngine.poolKey(filters())];$('bar').style.width=`${Math.min(100,(pool.seenIds.length/Math.max(1,pool.eligibleCount))*100)}%`}
function gradeAnswer(){const accepted=Array.isArray(current.accepted_answers)&&current.accepted_answers.length?current.accepted_answers:[current.answer];const ok=accepted.map(Number).includes(Number(selected));stats.attempts++;if(ok)stats.correct++;sessionAnswered++;const feedback=$('feedback');feedback.hidden=false;feedback.className='status '+(ok?'ok':'bad');feedback.textContent=(ok?'答對！':'答錯。')+` 正確答案：${accepted.map(n=>String.fromCharCode(64+Number(n))).join('、')}`+(current.explanation?`\n解析：${current.explanation}`:'');[...$('choices').children].forEach((b,i)=>{b.disabled=true;if(accepted.map(Number).includes(i+1))b.classList.add('correct');else if(i+1===selected)b.classList.add('wrong')});$('next').disabled=false;if(sessionAnswered>=Number($('questionLimit').value)){sessionComplete=true;$('next').textContent='完成本組';feedback.textContent+='\n本組題數已完成，按「完成本組」結束。'}save();$('count').textContent=`本組第 ${sessionAnswered}／${$('questionLimit').value} 題`}
function start(){const list=eligible();if(!list.length){$('loadStatus').textContent='目前篩選沒有題目。請確認 data/bank.json 已提交且格式正確。';return}sessionAnswered=0;sessionComplete=false;const f=filters();let q=SWStudyEngine.resume(list,f,state);if(!q){const result=SWStudyEngine.nextQuestion(list,f,state);q=result.question;save()}if(q)loadQuestion(q);else $('loadStatus').textContent='找不到可載入的題目。'}
$('next').addEventListener('click',()=>{if(sessionComplete){sessionAnswered=0;sessionComplete=false;$('loadStatus').textContent='上一組已完成。開始下一組。'}const result=SWStudyEngine.nextQuestion(eligible(),filters(),state);save();if(result.question)loadQuestion(result.question);else $('loadStatus').textContent='找不到可載入的題目。'});
$('start').addEventListener('click',start);$('reset').addEventListener('click',()=>{if(!confirm('確定重設目前年度與科目的出題進度？作答統計不會清除。'))return;delete state.pools[SWStudyEngine.poolKey(filters())];sessionAnswered=0;sessionComplete=false;save();$('quiz').hidden=true;$('loadStatus').textContent='此組進度已重設。按「開始／繼續」重新出題。'});
['year','subject'].forEach(id=>$(id).addEventListener('change',()=>{current=null;sessionAnswered=0;sessionComplete=false;$('quiz').hidden=true;renderStats()}));$('questionLimit').addEventListener('change',()=>{sessionAnswered=0;sessionComplete=false;if(current){$('count').textContent=`本組第 1／${$('questionLimit').value} 題`;}});
$('login').addEventListener('click',async()=>{const email=$('email').value.trim();if(!email){setAuthStatus('請先輸入電子郵件。','bad');return}if(!client){setAuthStatus('登入服務尚未載入，請重新整理頁面後再試。','bad');return}$('login').disabled=true;try{const {error}=await client.auth.signInWithOtp({email,options:{emailRedirectTo:location.href.split('#')[0]}});if(error)throw error;setAuthStatus('登入連結已寄出，請到信箱點擊連結返回網站。','ok')}catch(e){setAuthStatus('寄送失敗：'+(e.message||'請確認電子郵件設定'),'bad')}finally{$('login').disabled=false}});
$('logout').addEventListener('click',async()=>{if(!client)return;const {error}=await client.auth.signOut();if(error){setAuthStatus('登出失敗：'+error.message,'bad');return}user=null;$('logout').hidden=true;$('login').hidden=false;setAuthStatus('已登出；目前裝置仍保留本機進度。');setSyncStatus('登入後會同步出題進度與作答統計。')});
if(window.supabase?.createClient){client=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);client.auth.onAuthStateChange((event,session)=>{user=session?.user||null;if(user){$('login').hidden=true;$('logout').hidden=false;setAuthStatus('已登入：'+user.email,'ok');if(bankReady)syncCloud()}else{$('login').hidden=false;$('logout').hidden=true;setAuthStatus('尚未登入；目前進度保存在此瀏覽器。')}})}else{setAuthStatus('登入元件載入失敗；請確認網路連線後重新整理。','bad')}
fetch('data/bank.json').then(r=>{if(!r.ok)throw Error(`HTTP ${r.status}`);return r.json()}).then(data=>{bank=Array.isArray(data)?data:(data.questions||[]);const years=[...new Set(bank.map(q=>String(q.year)).filter(Boolean))].sort();years.forEach(y=>{const o=document.createElement('option');o.value=y;o.textContent=`${y} 年`;$('year').append(o)});subjects.forEach(s=>{const o=document.createElement('option');o.value=s;o.textContent=s;$('subject').append(o)});state=SWStudyEngine.readState();stats=safeParse(localStorage.getItem(STATS_KEY),stats);bankReady=true;$('loadStatus').textContent=`題庫載入 ${bank.length.toLocaleString()} 題。選年度／科目與每組題數後開始。`;renderStats();if(user)syncCloud()}).catch(e=>{$('loadStatus').textContent=`題庫載入失敗：${e.message}。請確認 data/bank.json 已提交且格式正確。`});
})();
</script></body></html>
